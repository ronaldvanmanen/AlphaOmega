plugins {
    id "com.diffplug.spotless"
    id 'org.graalvm.buildtools.native'
    id 'org.springframework.boot'
    id 'info.solidsoft.pitest'
    id 'io.spring.dependency-management'
    id 'jacoco'
    id 'java'
    id 'test-report-aggregation'
}

group = 'com.ragnvaldr'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(22)
    }
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

ext {
    set('springShellVersion', '3.3.2')
}

dependencies {
    compileOnly libs.annotations
    implementation libs.jsr305
    implementation libs.pitest
    implementation libs.pitest.junit5.plugin
    implementation libs.spring.boot.starter.actuator
    implementation libs.spring.shell.starter
    testImplementation libs.spring.boot.starter.test
    testImplementation libs.spring.shell.starter.test
    testImplementation libs.jqwik
    testRuntimeOnly libs.junit.platform.launcher
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.shell:spring-shell-dependencies:_"
    }
}

tasks.named('pitest') {
    dependsOn('build')
}

test {
    useJUnitPlatform
    {
        includeEngines 'jqwik', 'junit-jupiter'
    }

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
        showCauses true
        showExceptions true
        showStackTraces true
        showStandardStreams false
    }

    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = '0.8.12'
}

jacocoTestReport {
    reports {
        xml.required = true
    }
    dependsOn test
}

pitest {
    pitestVersion = '1.17.0'
    outputFormats = ['XML', 'HTML']
    exportLineCoverage = true
}

spotless {
    format 'misc', {
        target '*.gradle', '.gitattributes', '.gitignore'

        trimTrailingWhitespace()
        indentWithSpaces()
        endWithNewline()
    }

    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java'

        licenseHeaderFile rootProject.file('gradle/spotless/license.java')
        importOrder('java', 'javax', 'com', 'org', '', '\\#')
        removeUnusedImports()

        trimTrailingWhitespace()
        indentWithSpaces()
        endWithNewline()
    }
}
